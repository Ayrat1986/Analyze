name: Fast Update Database

on:
  workflow_dispatch: # Кнопка для ручного запуска
  schedule:
    - cron: '0 */2 * * *' # Каждые 2 часа

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install curl_cffi requests python-chess

      - name: Run Light Update
        run: |
          python src/update_light.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/chess.db data/chess_api_cache.json
          # Коммитим, только если есть изменения
          git diff-index --quiet HEAD || git commit -m "Auto-update DB [skip ci]"
          git push