name: Fast Update Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

# ЭТА СТРОКА ДАЕТ ПРАВА НА ЗАПИСЬ (исправляет exit code 128)
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install curl_cffi requests python-chess

      - name: Run Light Update
        run: |
          python src/update_light.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/chess.db data/chess_api_cache.json
          # Эта команда проверяет, были ли изменения, и коммитит только если они есть
          git diff-index --quiet HEAD || git commit -m "Auto-update database with new games"
          git push
