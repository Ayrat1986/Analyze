name: Full Update Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3,6,9 * * *' 

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Full Pipeline
        run: |
          python run.py --steps 1,2,3,4,13 --keep-going
        env:
          STOCKFISH_PATH: /usr/games/stockfish

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          # Флаг -f заставляет добавить файлы, даже если они в .gitignore
          git add -f data/chess.db data/stockfish_cache.json data/chess_api_cache.json reports/
          
          git diff-index --quiet HEAD || git commit -m "Auto-update DB and Reports [skip ci]"
          git pull --rebase origin main || true
          git push